name: Windows release build

# Lightweight build of the Windows client only (for this fork).
# Start it from the Actions tab ("Run workflow") or by pushing to the mod branch.
on:
  workflow_dispatch:
  push:
    branches:
      - kagune-hook-quickhammer

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CARGO_HTTP_MULTIPLEXING: false
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.2
      with:
        version: 1.3.296.0
        cache: true

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2.9.2
      with:
        workspaces: |
          ./

    - name: Build release
      run: |
        mkdir release
        cd release
        cmake -A x64 -DEXCEPTION_HANDLING=ON -DVULKAN=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=. ..
        cmake --build . --config Release --target package_default

    - name: Collect package
      run: |
        cd release
        mkdir artifacts
        mv *-win64.zip artifacts

    - name: Upload zip
      uses: actions/upload-artifact@v6
      with:
        name: ddnet-kagune-win64
        path: release/artifacts
