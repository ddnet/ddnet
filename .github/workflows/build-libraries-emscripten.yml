name: Build Emscripten (WebAssembly) libraries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-libraries-emscripten:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false

    - name: Prepare Linux
      run: |
        sudo apt-get update -y
        sudo apt-get install autoconf automake cmake libtool m4 ninja-build
        git clone https://github.com/emscripten-core/emsdk emsdk
        cd emsdk
        ./emsdk install 4.0.22
        ./emsdk activate 4.0.22

    - name: Build Emscripten (WebAssembly) libraries
      run: |
        source emsdk/emsdk_env.sh
        export M4=/usr/bin/m4
        scripts/compile_libs/gen_libs.sh build-webasm-libs webasm

    - name: Upload Artifacts
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: ddnet-libs-webasm
        path: build-webasm-libs/ddnet-libs
